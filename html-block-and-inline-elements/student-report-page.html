<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Student Report</title>
</head>
<body>
  <header>
    <h1>Greenfield High School</h1>
  </header>

  <main>
    <h2>Student: John Doe</h2>

    <!-- Table of marks for 5 subjects -->
    <table border="1" title="Marks Table">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Marks Obtained</th>
          <th>Max Marks</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Mathematics</td><td>85</td><td>100</td></tr>
        <tr><td>Physics</td><td>78</td><td>100</td></tr>
        <tr><td>Chemistry</td><td>82</td><td>100</td></tr>
        <tr><td>English</td><td>90</td><td>100</td></tr>
        <tr><td>Computer Science</td><td>88</td><td>100</td></tr>
        <!-- Total row using colspan -->
        <tr>
          <td colspan="2" title="Total marks obtained">Total</td>
          <td>423 / 500</td>
        </tr>
        <tr>
          <td colspan="2">Percentage</td>
          <td>84.6%</td>
        </tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Class Teacher: Mrs. X | Date: 2025-10-12</p>
  </footer>
</body>
</html>

<!DOCTYPE html>

<head>

  <title>Movie Database</title>
</head>
<body>
  <header>
    <h1>Movie Database</h1>
  </header>

  <main>
    <table border="1" title="Movie Table" summary="List of movies with details">

          <th>Movie Name</th>
          <th>Genre</th>

          <td>Inception</td>
          <td>Action/Sci-Fi</td>

        </tr>
        <tr title="A classic crime film">
          <td>The Godfather</td>
          <td>Crime</td>
          <td>1972</td>
          <td>9.2</td>
          <td><a href="https://www.imdb.com/title/tt0068646/">IMDB</a></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="5"><small>Note: Ratings are from IMDB and may change over time.</small></td>
        </tr>
      </tfoot>
    </table>
  </main>

  <footer>
    <p>© Movie Database</p>
  </footer>
</body>
</html>

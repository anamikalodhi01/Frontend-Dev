<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <header>
    <h1>Location & Place Selector</h1>
  </header>

  <main>
    <form action="#" method="get">
      <p>
        <label for="country">Country:</label><br>
        <select id="country" name="country">
          <option value="india" selected>India</option>
          <option value="france">France</option>
          <option value="japan">Japan</option>
        </select>
      </p>

      <p>
        <label for="state">State:</label><br>
        <select id="state" name="state">
          <option value="bihar" selected>Bihar</option>
          <option value="maharashtra">Maharashtra</option>
          <option value="karnataka">Karnataka</option>
        </select>
      </p>

      <p>
        <label for="city">City:</label><br>
        <select id="city" name="city">
          <option value="patna" selected>Patna</option>
          <option value="pune">Pune</option>
          <option value="bangalore">Bangalore</option>
        </select>
      </p>

      <p>
        <label for="place">Favorite Tourist Place:</label><br>
        <select id="place" name="place">
          <option value="taj" selected>Taj Mahal</option>
          <option value="qutub">Qutub Minar</option>
          <option value="goa">Goa Beaches</option>
        </select>
      </p>
    </form>

    <p>
      <!-- Summary paragraph -->
      I selected <strong>India</strong>, <strong>Bihar</strong>, <strong>Patna</strong> and my favorite tourist place is <strong>Taj Mahal</strong>.
    </p>
  </main>

  <footer>
    <p>© 2025 Selection Demo</p>
  </footer>
</body>
</html>
